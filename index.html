<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Basic SEO -->
    <title>SkillSprint Technologies | IT Solutions, Web Development & Digital Services</title>
    <meta
      name="description"
      content="SkillSprint Technologies provides modern IT solutions, web development, digital marketing, software development, automation, training, and placement services for growing businesses."
    />
    <meta
      name="keywords"
      content="SkillSprint Technologies, IT solutions, web development, digital marketing, software development, automation, chatbot development, software training, placement services, business technology solutions"
    />
    <meta name="author" content="SkillSprint Technologies" />
    <meta name="robots" content="index, follow" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo2.png" />
    <link rel="apple-touch-icon" href="/logo2.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#374b82" />

    <!-- Open Graph SEO -->
    <meta
      property="og:title"
      content="SkillSprint Technologies | IT Solutions for Growing Businesses"
    />
    <meta
      property="og:description"
      content="Build, scale, and grow your business with SkillSprint Technologies. We offer web development, digital marketing, software solutions, automation, training, and placement services."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://skillsprinttechnologies.com" />
    <meta property="og:image" content="https://skillsprinttechnologies.com/logo2.png" />
    <meta property="og:site_name" content="SkillSprint Technologies" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="SkillSprint Technologies | IT Solutions & Digital Services"
    />
    <meta
      name="twitter:description"
      content="Modern IT solutions, web development, digital marketing, software development, automation, training, and placement services."
    />
    <meta
      name="twitter:image"
      content="https://skillsprinttechnologies.com/logo2.png"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://skillsprinttechnologies.com" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SkillSprint Technologies",
        "url": "https://skillsprinttechnologies.com",
        "logo": "https://skillsprinttechnologies.com/logo2.png",
        "description": "SkillSprint Technologies provides IT solutions, web development, digital marketing, software development, automation, training, and placement services.",
        "sameAs": [
          "https://www.linkedin.com/",
          "https://www.instagram.com/",
          "https://www.facebook.com/"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "Customer Support",
          "areaServed": "IN",
          "availableLanguage": ["English", "Hindi", "Kannada"]
        }
      }
    </script>
  </head>

  <body>
    <noscript>
